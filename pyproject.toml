[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servers", "common"]

[tool.hatch.build.targets.sdist]
include = ["/servers", "/common", "/tests", "/scripts", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]
