[project]
name = "bioinformatics-mcp"
version = "0.1.0"
description = "Independent MCP servers for bioinformatics data services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.30.0,<2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "twine>=7,<8"]
cellxgene = ["cellxgene-census>=1.18.0,<2", "tiledbsoma>=1.15.3,<2"]

[project.scripts]
ncbi-mcp = "servers.ncbi_mcp.server:main"
pdb-mcp = "servers.pdb_mcp.server:main"
string-mcp = "servers.string_mcp.server:main"
ensembl-mcp = "servers.ensembl_mcp.server:main"
bioconductor-mcp = "servers.bioconductor_mcp.server:main"
anaconda-mcp = "servers.anaconda_mcp.server:main"
cncb-mcp = "servers.cncb_mcp.server:main"
publications-mcp = "servers.publications_mcp.server:main"
ena-mcp = "servers.ena_mcp.server:main"
uniprot-mcp = "servers.uniprot_mcp.server:main"
gprofiler-mcp = "servers.gprofiler_mcp.server:main"
biostudies-mcp = "servers.biostudies_mcp.server:main"
interpro-mcp = "servers.interpro_mcp.server:main"
gdc-mcp = "servers.gdc_mcp.server:main"
reactome-mcp = "servers.reactome_mcp.server:main"
cellxgene-mcp = "servers.cellxgene_mcp.server:main"
chembl-mcp = "servers.chembl_mcp.server:main"
gwas-mcp = "servers.gwas_mcp.server:main"
opentargets-mcp = "servers.opentargets_mcp.server:main"
cbioportal-mcp = "servers.cbioportal_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["servers", "common"]

[tool.hatch.build.targets.sdist]
include = ["/servers", "/common", "/tests", "/scripts", "/docs", "/README.md", "/LICENSE", "/pyproject.toml"]
