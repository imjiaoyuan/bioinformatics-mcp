[project]
name = "bioinformatics-mcp"
version = "0.1.0"
description = "Independent MCP servers for bioinformatics data services"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.30.0,<2",
  "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "build>=1,<2", "twine>=7,<8"]
cellxgene = ["cellxgene-census>=1.18.0,<2", "tiledbsoma>=1.15.3,<2"]

[project.scripts]
bioinformatics-mcp = "common.cli:main"
ncbi-mcp = "servers.ncbi_mcp.server:main"
pdb-mcp = "servers.pdb_mcp.server:main"
string-mcp = "servers.string_mcp.server:main"
ensembl-mcp = "servers.ensembl_mcp.server:main"
bioconductor-mcp = "servers.bioconductor_mcp.server:main"
anaconda-mcp = "servers.anaconda_mcp.server:main"
cncb-mcp = "servers.cncb_mcp.server:main"
publications-mcp = "servers.publications_mcp.server:main"
ena-mcp = "servers.ena_mcp.server:main"
uniprot-mcp = "servers.uniprot_mcp.server:main"
gprofiler-mcp = "servers.gprofiler_mcp.server:main"
biostudies-mcp = "servers.biostudies_mcp.server:main"
interpro-mcp = "servers.interpro_mcp.server:main"
gdc-mcp = "servers.gdc_mcp.server:main"
reactome-mcp = "servers.reactome_mcp.server:main"
cellxgene-mcp = "servers.cellxgene_mcp.server:main"
chembl-mcp = "servers.chembl_mcp.server:main"
gwas-mcp = "servers.gwas_mcp.server:main"
opentargets-mcp = "servers.opentargets_mcp.server:main"
cbioportal-mcp = "servers.cbioportal_mcp.server:main"
sra-mcp = "servers.sra_mcp.server:main"
gtex-mcp = "servers.gtex_mcp.server:main"
hpa-mcp = "servers.hpa_mcp.server:main"
alphafold-mcp = "servers.alphafold_mcp.server:main"
emdb-mcp = "servers.emdb_mcp.server:main"
kegg-mcp = "servers.kegg_mcp.server:main"
panglao-mcp = "servers.panglao_mcp.server:main"
intact-mcp = "servers.intact_mcp.server:main"
biogrid-mcp = "servers.biogrid_mcp.server:main"
depmap-mcp = "servers.depmap_mcp.server:main"
civic-mcp = "servers.civic_mcp.server:main"
clinvar-mcp = "servers.clinvar_mcp.server:main"
pharmgkb-mcp = "servers.pharmgkb_mcp.server:main"
disgenet-mcp = "servers.disgenet_mcp.server:main"
mondo-mcp = "servers.mondo_mcp.server:main"
hpo-mcp = "servers.hpo_mcp.server:main"
quickgo-mcp = "servers.quickgo_mcp.server:main"
singlecell-mcp = "servers.singlecell_mcp.server:main"
vep-mcp = "servers.vep_mcp.server:main"
ucsc-mcp = "servers.ucsc_mcp.server:main"
mygene-mcp = "servers.mygene_mcp.server:main"
bigg-mcp = "servers.bigg_mcp.server:main"
